version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dhara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dhara_db_data:/var/lib/postgresql/data
      - ./backend/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/seed/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/dhara?sslmode=disable
      JWT_SECRET: dev-secret-change-me
      ALLOWED_ORIGINS: http://localhost:3000
      SIGNED_URL_SECRET: dev-signed-url-secret
      SITE_BASE_URL: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  dhara_db_data:
