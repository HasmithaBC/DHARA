services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dhara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dhara_db_data:/var/lib/postgresql/data
      # Run once, the first time the database volume is created.
      - ./backend/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/seed/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/dhara?sslmode=disable
      JWT_SECRET: dev-secret-change-me
      # Browser origins allowed to call the API (comma-separated). Must include the website's address.
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SIGNED_URL_SECRET: dev-signed-url-secret
      SITE_BASE_URL: http://localhost:8080
      FRONTEND_BASE_URL: http://localhost:3000
      MEDIA_UPLOAD_DIR: /data/uploads
    volumes:
      - dhara_uploads:/data/uploads # uploaded photos/PDFs survive rebuilds
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # What a visitor's BROWSER uses to reach the API (baked in at build time):
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        # Where the Next.js proxy for /uploads points (build time, container-to-container):
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # What the Next.js SERVER uses while rendering pages (runtime, container-to-container).
      API_INTERNAL_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  dhara_db_data:
  dhara_uploads:
